<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Gerador de Rolê — João Pessoa</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
      --muted: #94a3b8; --accent: #f59e0b; --accent-dark: #d97706;
      --border: #334155; --link: #7dd3fc;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); margin: 0;
      padding: 28px 16px; min-height: 100vh;
    }
    .container { max-width: 760px; width: 100%; margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { color: var(--accent); margin: 0 0 8px; font-size: clamp(1.65rem, 5vw, 2.1rem); }
    .intro { color: var(--muted); margin: 0; line-height: 1.5; }
    form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-group {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 15px; min-width: 0;
    }
    .form-group label { display: block; font-weight: 650; margin-bottom: 9px; }
    select {
      width: 100%; padding: 11px 12px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; font: inherit;
    }
    select:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 3px;
    }
    .actions { grid-column: 1 / -1; display: flex; gap: 10px; }
    button {
      border: 0; border-radius: 10px; padding: 13px 16px; font: inherit;
      font-weight: 750; cursor: pointer;
    }
    .primary { flex: 1; background: var(--accent); color: #111827; }
    .primary:hover { background: var(--accent-dark); }
    .secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .results { margin-top: 28px; }
    .results-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .results-heading h2 { font-size: 1.2rem; margin: 0; }
    .count { color: var(--muted); font-size: .9rem; }
    .result-card {
      background: var(--card); border: 1px solid var(--border);
      border-left: 4px solid var(--accent); border-radius: 10px;
      padding: 16px; margin-bottom: 12px;
    }
    .result-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .result-card h3 { margin: 0; font-size: 1.12rem; }
    .instagram {
      color: var(--link); text-decoration: none; font-weight: 650;
      font-size: .9rem; white-space: nowrap;
    }
    .instagram:hover { text-decoration: underline; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .tag {
      background: rgba(245,158,11,.12); color: #fbbf24; padding: 5px 8px;
      border-radius: 6px; font-size: .82rem;
    }
    .empty-state {
      text-align: center; color: var(--muted); background: var(--card);
      padding: 24px; border-radius: 12px; border: 1px dashed var(--border);
    }
    .note { color: var(--muted); font-size: .82rem; line-height: 1.45; margin-top: 18px; }
    @media (max-width: 600px) {
      form { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      .result-top { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Descubra o rolê 🎯</h1>
      <p class="intro">Responda às perguntas e encontre opções em João Pessoa que combinam com seu momento.</p>
    </header>

    <form id="roleForm">
      <div class="form-group">
        <label for="ambiente">Que tipo de espaço você prefere?</label>
        <select id="ambiente">
          <option value="Qualquer">Qualquer um</option>
          <option value="Aberto">Aberto</option>
          <option value="Fechado">Fechado</option>
          <option value="Misto">Misto</option>
        </select>
      </div>
      <div class="form-group">
        <label for="vibe">Qual é a sua vibe hoje?</label>
        <select id="vibe">
          <option value="Qualquer">Qualquer vibe</option>
          <option value="Festa">Festa</option>
          <option value="Karaokê">Karaokê</option>
          <option value="Evento cultural">Evento cultural / alternativo</option>
          <option value="Boteco">Boteco</option>
          <option value="Pub">Pub</option>
          <option value="Show">Show</option>
          <option value="Couvert">Música ao vivo / couvert</option>
        </select>
      </div>
      <div class="form-group">
        <label for="musica">Quer música ao vivo?</label>
        <select id="musica">
          <option value="Indiferente">Indiferente</option>
          <option value="Sim">Sim</option>
          <option value="Não">Não</option>
        </select>
      </div>
      <div class="form-group">
        <label for="comida">Quer um lugar para comer?</label>
        <select id="comida">
          <option value="Indiferente">Indiferente</option>
          <option value="Sim">Sim</option>
          <option value="Não">Não</option>
        </select>
      </div>
      <div class="form-group">
        <label for="praia">Onde pode ser?</label>
        <select id="praia">
          <option value="Indiferente">Qualquer região</option>
          <option value="Sim">Apenas na praia</option>
          <option value="Não">Fora da praia</option>
        </select>
      </div>
      <div class="form-group">
        <label for="preco">Qual é o seu orçamento por pessoa?</label>
        <select id="preco">
          <option value="Qualquer">Sem limite definido</option>
          <option value="Até R$ 30">Até R$ 30</option>
          <option value="Até R$ 60">Até R$ 60</option>
          <option value="Até R$ 90">Até R$ 90</option>
          <option value="Mais de R$ 90">Mais de R$ 90</option>
        </select>
      </div>
      <div class="actions">
        <button type="submit" class="primary">Encontrar meu rolê 🎲</button>
        <button type="reset" class="secondary">Limpar filtros</button>
      </div>
    </form>

    <section class="results" id="resultados" aria-live="polite"></section>
    <p class="note">Os perfis do Instagram são links de busca quando o endereço oficial não foi cadastrado. Confira o perfil e a programação antes de sair; atrações, preços e funcionamento podem mudar.</p>
  </main>

    const niveisPreco = { "Até R$ 30": 1, "Até R$ 60": 2, "Até R$ 90": 3, "Mais de R$ 90": 4 };
    const form = document.getElementById("roleForm");
    const container = document.getElementById("resultados");

    function linkInstagram(lugar) {
      const url = lugar.instagram
        ? `https://www.instagram.com/${encodeURIComponent(lugar.instagram.replace(/^@/, ""))}/`
        : `https://www.google.com/search?q=${encodeURIComponent(lugar.nome + " João Pessoa Instagram oficial")}`;
      const texto = lugar.instagram ? "Instagram ↗" : "Buscar Instagram ↗";
      return `<a class="instagram" href="${url}" target="_blank" rel="noopener noreferrer">${texto}</a>`;
    }

    function filtrarRoles(event) {
      if (event) event.preventDefault();
      const ambiente = document.getElementById("ambiente").value;
      const vibe = document.getElementById("vibe").value;
      const musica = document.getElementById("musica").value;
      const comida = document.getElementById("comida").value;
      const praia = document.getElementById("praia").value;
      const preco = document.getElementById("preco").value;

      const resultados = lugares.filter(item => {
        if (ambiente !== "Qualquer" && item.ambiente !== ambiente && item.ambiente !== "Misto") return false;
        if (vibe !== "Qualquer" && item.vibe !== vibe) return false;
        if (musica !== "Indiferente" && item.musica !== musica) return false;
        if (comida !== "Indiferente" && item.comida !== comida) return false;
        if (praia !== "Indiferente" && item.praia !== praia) return false;
        if (preco !== "Qualquer" && niveisPreco[item.preco] > niveisPreco[preco]) return false;
        return true;
      });

      container.innerHTML = "";
      if (!resultados.length) {
        container.innerHTML = `<div class="empty-state"><h3>Nenhum rolê encontrado 😕</h3><p>Tente flexibilizar algum filtro, como orçamento ou vibe.</p></div>`;
        return;
      }

      const heading = document.createElement("div");
      heading.className = "results-heading";
      heading.innerHTML = `<h2>Opções para o seu rolê</h2><span class="count">${resultados.length} resultado(s)</span>`;
      container.appendChild(heading);

      // Embaralha a ordem para variar as sugestões, sem alterar os filtros.
      const embaralhados = [...resultados].sort(() => Math.random() - 0.5);
      embaralhados.forEach(item => {
        const card = document.createElement("article");
        card.className = "result-card";
        const topo = document.createElement("div");
        topo.className = "result-top";
        const titulo = document.createElement("h3");
        titulo.textContent = item.nome;
        topo.appendChild(titulo);
        topo.insertAdjacentHTML("beforeend", linkInstagram(item));
        card.appendChild(topo);

        const tags = document.createElement("div");
        tags.className = "tags";
        [
          `📍 ${item.ambiente}`,
          `🎭 ${item.vibe}`,
          `🎵 Música ao vivo: ${item.musica}`,
          `🍽️ Comer bem: ${item.comida}`,
          `🏖️ Praia: ${item.praia}`,
          `💰 ${item.preco}`
        ].forEach(texto => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = texto;
          tags.appendChild(tag);
        });
        card.appendChild(tags);
        container.appendChild(card);
      });
    }

    form.addEventListener("submit", filtrarRoles);
    form.addEventListener("reset", () => {
      setTimeout(() => {
        container.innerHTML = "";
      }, 0);
    });
